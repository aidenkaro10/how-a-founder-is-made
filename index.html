<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How a Founder Is Made</title>
<meta name="description" content="How a Founder Is Made: Israel Edition. Why is the Israeli startup ecosystem so effective? Live Omer's or Shira's childhood, army years and startup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Patrick+Hand&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css?v=20261010231357">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body class="is-locked">

<!-- Laptop only: phones get a friendly note instead -->
<div id="laptopOnly">
  <p class="hand">This one's made for a laptop.</p>
  <p>Open it on a computer, turn the sound on, and press play.</p>
</div>

<!-- 1. The vault opening (js/vault.js draws into this) -->
<div id="vault" aria-label="Opening"></div>

<!-- 2. The film: fixed stage, scenes stack on top of each other -->
<div id="stage" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- HUD: age counter, place, progress, buttons -->
<div id="hud">
  <!-- age and place live on the notebook pages now -->
  <span id="ageNum" hidden></span><span id="place" hidden></span>
  <button id="filmBtn" class="mono" aria-pressed="false">Play as film</button>
  <button id="soundBtn" class="mono" aria-pressed="false">Sound off</button>
  <div class="progress"><div id="progressFill"></div></div>
</div>

<!-- Words on screen: spoken lines (bottom), handwritten fact notes (corner), optional narration subtitles -->
<div id="captions" aria-live="polite"></div>
<div id="notes" aria-hidden="true"></div>

<!-- Tall spacer so there's something to scroll. Height is set by main.js -->
<main>
  <div id="track"></div>

  <!-- 3. After the credits pages: a small footer with the sources -->
  <section id="ending">
    <div class="wrap">
      <p class="small">Every fact in this film is real. <a href="research.md">Research and sources</a></p>
      <button id="replay" class="replay mono">Watch again</button>
    </div>
  </section>
</main>

<script type="module" src="js/main.js?v=20261010231357"></script>
</body>
</html>
